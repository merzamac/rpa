[project]
name = "rpa"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "merzamac", email = "100945727+merzamac@users.noreply.github.com"},
]
dependencies = ["playwright>=1.60.0", "uiautomation>=2.0.29"]
